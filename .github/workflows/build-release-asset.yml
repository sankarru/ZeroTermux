name: Build APK to release

# Actions artifact storage is quota-limited per account, so this publishes the
# APK as a release asset instead (separate storage) and uploads nothing to the
# artifact store. Same Gradle invocation as build.yml.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        type: choice
        options:
          - arm64
          - universal
          - all
        default: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAVA_VERSION: "17"
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK (${{ inputs.arch }})
        run: ./gradlew --build-cache --parallel --stacktrace :app:assembleDebug -Darch=${{ inputs.arch }}

      - name: Publish APK as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-${{ github.run_number }}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no APK produced under app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "found ${#apks[@]} APK(s): ${apks[*]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${apks[@]}" --clobber
          else
            gh release create "$tag" "${apks[@]}" \
              --title "ZeroTermux debug ${{ inputs.arch }} (run ${{ github.run_number }})" \
              --notes "Gradle :app:assembleDebug -Darch=${{ inputs.arch }}\ncommit ${{ github.sha }}"
          fi
          echo "release asset published at tag $tag"